<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/langs.js"></script>
    <style>
        /* ===== 卡片链接 ===== */
        .card-link {
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .card-link:hover .card {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }

        /* ===== 布局容器 ===== */
        .page-tools-content {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            position: relative;
        }

        /* ===== 卡片容器 ===== */
        .card-grid-wrapper {
            flex: 0 0 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top left;
            will-change: transform, opacity, flex;
        }
        .card-grid-wrapper.shrink {
            flex: 0 0 28%;
            transform: scale(0.85) translateX(-6%);
            opacity: 0.8;
        }

        /* ===== 卡片网格：默认4列 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin: 0;
            width: 100%;
            transition: grid-template-columns 0.5s ease;
        }
        .card-grid-wrapper.shrink .card-grid {
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        /* ===== 卡片样式 ===== */
        .card-grid .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.8rem 1.6rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: left;
        }
        .card-grid .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .card-grid .card .icon {
            font-size: 2.2rem;
            margin-bottom: 0.6rem;
            display: inline-block;
        }
        .card-grid .card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }
        .card-grid .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .card-grid .card .tool-tag {
            display: inline-block;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            background: var(--bg-body);
            color: var(--text-secondary);
        }

        /* 收缩状态下的卡片 */
        .card-grid-wrapper.shrink .card-grid .card {
            padding: 0.9rem 1rem;
        }
        .card-grid-wrapper.shrink .card-grid .card .icon {
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
        }
        .card-grid-wrapper.shrink .card-grid .card h3 {
            font-size: 0.95rem;
            margin-bottom: 0.1rem;
        }
        .card-grid-wrapper.shrink .card-grid .card p {
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .card-grid-wrapper.shrink .card-grid .card .tool-tag {
            font-size: 0.6rem;
            margin-top: 0.2rem;
            padding: 0.05rem 0.5rem;
        }

        /* ===== 右侧内容 ===== */
        .content-area {
            flex: 1;
            min-width: 0;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .content-area.active {
            display: block;
            opacity: 1;
        }

        .content-area iframe {
            width: 100%;
            height: 550px;
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            background: transparent;
        }

        .content-area .tool-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 2rem;
            box-shadow: var(--shadow);
            text-align: center;
            color: var(--text-secondary);
        }
        .content-area .tool-content h3 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .back-btn {
            margin-top: 1rem;
        }

        .todo-widget {
            display: none !important;
        }

        @media (max-width: 820px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .page-tools-content {
                flex-direction: column;
            }
            .card-grid-wrapper {
                flex: 1 1 auto;
                width: 100%;
            }
            .card-grid-wrapper.shrink {
                flex: 1 1 auto;
                transform: scale(1) translateX(0);
                opacity: 1;
                width: 100%;
            }
            .card-grid-wrapper.shrink .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .content-area {
                width: 100%;
                margin-top: 1.5rem;
            }
            .content-area iframe {
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .card-grid-wrapper.shrink .card-grid {
                grid-template-columns: 1fr 1fr;
            }
            .card-grid .card {
                padding: 1rem 0.8rem;
            }
            .card-grid .card .icon {
                font-size: 1.6rem;
            }
            .card-grid .card h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="pages">
        <section id="page-tools" class="page active">
            <h2 class="page-title" data-i18n="tools_title"></h2>
            <p class="page-desc" data-i18n="tools_desc"></p>

            <div class="page-tools-content">
                <!-- 卡片 -->
                <div class="card-grid-wrapper" id="cardGridWrapper">
                    <div class="card-grid">
                        <div class="card-link" data-tool="virtual-water" onclick="openTool('virtual-water')">
                            <div class="card">
                                <div class="icon" data-i18n="tools_card_1_icon"></div>
                                <h3 data-i18n="tools_card_1"></h3>
                                <p data-i18n="tools_card_1_desc"></p>
                            </div>
                        </div>
                        <div class="card-link" data-tool="timer" onclick="openTool('timer')">
                            <div class="card">
                                <div class="icon" data-i18n="tools_card_2_icon"></div>
                                <h3 data-i18n="tools_card_2"></h3>
                                <p data-i18n="tools_card_2_desc"></p>
                                <span class="tool-tag" data-i18n="tools_card_2_tag"></span>
                            </div>
                        </div>
                        <div class="card-link" data-tool="dashboard" onclick="openTool('dashboard')">
                            <div class="card">
                                <div class="icon" data-i18n="tools_card_3_icon"></div>
                                <h3 data-i18n="tools_card_3"></h3>
                                <p data-i18n="tools_card_3_desc"></p>
                                <span class="tool-tag" data-i18n="tools_card_3_tag"></span>
                            </div>
                        </div>
                        <a href="/tools/Projects/DONTOPENIT.html" class="card-link">
                            <div class="card">
                                <div class="icon" data-i18n="tools_card_4_icon"></div>
                                <h3 data-i18n="tools_card_4"></h3>
                                <p data-i18n="tools_card_4_desc"></p>
                                <span class="tool-tag" data-i18n="tools_card_4_tag"></span>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- 右侧内容 -->
                <div class="content-area" id="contentArea">
                    <div id="contentInner"></div>
                    <!-- 按钮文字从语言包读取 -->
                    <button class="btn back-btn" onclick="closeTool()" data-i18n="back_to_list"></button>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // ===== 工具内容映射（占位内容从语言包动态获取） =====
        function getToolPlaceholder(key) {
            const raw = getNestedValue(LANG_DATA.zh, key);
            if (!raw) return '<div class="tool-content"><p>内容加载中…</p></div>';
            const lines = raw.split('\n');
            return `
                <div class="tool-content">
                    <h3>${lines[0] || ''}</h3>
                    <p>${lines[1] || ''}</p>
                    <p style="margin-top:1rem;color:var(--text-muted);">${lines[2] || ''}</p>
                </div>
            `;
        }

        const toolContentMap = {
            'virtual-water': {
                title: '虚拟水计算器',
                src: '/tools/Projects/VirtualWaterCalculator/VirtualWaterCalculator.html',
            },
            'timer': {
                title: '计时器',
                html: getToolPlaceholder('tools_placeholder_timer')
            },
            'dashboard': {
                title: '数据看板',
                html: getToolPlaceholder('tools_placeholder_dashboard')
            },
            'links': {
                title: '链接收藏',
                html: getToolPlaceholder('tools_placeholder_links')
            }
        };

        // 辅助函数
        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        // ===== 打开工具 =====
        function openTool(toolId) {
            const wrapper = document.getElementById('cardGridWrapper');
            const contentArea = document.getElementById('contentArea');
            const contentInner = document.getElementById('contentInner');

            if (wrapper.classList.contains('shrink') && contentArea.dataset.activeTool === toolId) {
                return;
            }

            wrapper.classList.add('shrink');

            const tool = toolContentMap[toolId];
            if (!tool) return;

            contentInner.innerHTML = '';
            if (tool.src) {
                const iframe = document.createElement('iframe');
                iframe.src = tool.src;
                iframe.style.width = '100%';
                iframe.style.height = '550px';
                iframe.style.border = 'none';
                iframe.style.borderRadius = 'var(--radius)';
                iframe.style.boxShadow = 'var(--shadow)';
                iframe.style.background = 'transparent';
                contentInner.appendChild(iframe);
            } else if (tool.html) {
                contentInner.innerHTML = tool.html;
            }

            contentArea.classList.add('active');
            contentArea.dataset.activeTool = toolId;

            setTimeout(() => {
                contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // ===== 关闭工具 =====
        function closeTool() {
            const wrapper = document.getElementById('cardGridWrapper');
            const contentArea = document.getElementById('contentArea');

            wrapper.classList.remove('shrink');
            contentArea.classList.remove('active');
            delete contentArea.dataset.activeTool;
            document.getElementById('contentInner').innerHTML = '';
        }
    </script>

    <script src="../assets/js/main.js"></script>
</body>
</html>
