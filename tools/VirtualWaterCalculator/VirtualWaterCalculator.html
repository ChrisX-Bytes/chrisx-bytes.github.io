<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>虚拟水计算器</title>
    <style>
        /* ===== 计算器样式（完全透明背景） ===== */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --bg-body: transparent; /* 透明背景 */
            --bg-card: transparent;  /* 卡片透明 */
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --radius: 24px;
            --radius-sm: 14px;
            --shadow: none;          /* 无阴影 */
            --shadow-hover: none;
            --transition: 0.25s ease;
            --font: 'Inter', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: transparent; /* 完全透明 */
            color: var(--text-primary);
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: transparent; /* 去掉白色背景 */
            border: none;          /* 无边框 */
            box-shadow: none;      /* 无阴影 */
            padding: 2rem 1.5rem;
            transition: none;
        }
        .calc-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.4rem;
        }
        .calc-header span {
            color: var(--primary);
        }
        .calc-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1.8rem;
            line-height: 1.8;
        }
        .calc-desc .format-tag {
            display: inline-block;
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
            padding: 0.05rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid #d9e2ef;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.7); /* 半透明输入框 */
            color: var(--text-primary);
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            background: #fff;
        }
        .input-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .input-group .btn {
            padding: 0.8rem 2.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 18px rgba(79, 70, 229, 0.30);
            white-space: nowrap;
        }
        .input-group .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(79, 70, 229, 0.40);
        }
        .input-group .btn:active {
            transform: scale(0.97);
        }
        .result-box {
            background: rgba(255, 255, 255, 0.7); /* 半透明结果框 */
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.6rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            transition: var(--transition);
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
        }
        .result-box:focus {
            outline: none;
            border-color: var(--primary-light);
        }
        .result-box .error {
            color: #ef4444;
            font-weight: 500;
        }
        .result-box .total {
            font-weight: 700;
            color: var(--primary);
        }
        .result-box .unknown {
            color: #f59e0b;
            font-weight: 500;
        }
        .result-box::-webkit-scrollbar {
            width: 6px;
        }
        .result-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .result-box::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .result-box::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        .footer-note {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
        @media (max-width: 760px) {
            .container {
                padding: 1rem;
            }
            .calc-header {
                font-size: 1.8rem;
            }
            .calc-desc {
                font-size: 0.95rem;
            }
            .input-group input {
                min-width: 100%;
                font-size: 0.95rem;
                padding: 0.7rem 1rem;
            }
            .input-group .btn {
                width: 100%;
                justify-content: center;
                font-size: 0.95rem;
                padding: 0.7rem 1.2rem;
            }
            .result-box {
                font-size: 0.85rem;
                padding: 1rem 1.2rem;
                min-height: 80px;
                max-height: 220px;
            }
        }
        @media (max-width: 460px) {
            .container {
                padding: 0.8rem 0.5rem;
            }
            .calc-header {
                font-size: 1.4rem;
                gap: 6px;
            }
            .calc-desc {
                font-size: 0.85rem;
            }
            .result-box {
                font-size: 0.75rem;
                padding: 0.8rem 1rem;
                min-height: 60px;
                max-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calc-header">虚拟水<span>计算器</span></div>
        <p class="calc-desc">
            输入食物名称和重量（单位：克），格式：<span class="format-tag">食物1:重量, 食物2:重量</span>
            &nbsp;&nbsp;不写重量默认为 100 克
        </p>
        <div class="input-group">
            <input type="text" id="entry" placeholder="例如：牛肉:200, 苹果:150, 面包" />
            <button class="btn" id="calcBtn">计算虚拟水</button>
        </div>
        <div class="result-box" id="result">等待输入…</div>
        <div class="footer-note">数据为全球平均值，实际数值因产地和加工方式而异</div>
    </div>

    <script src="virtual_water_data.js"></script>
    <script>
        (function() {
            'use strict';
            if (typeof VIRTUAL_WATER === 'undefined') {
                document.getElementById('result').innerHTML = '<span class="error">❌ 数据文件加载失败。</span>';
                return;
            }
            const entry = document.getElementById('entry');
            const calcBtn = document.getElementById('calcBtn');
            const resultBox = document.getElementById('result');

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            function showResult(msg, isError) {
                if (isError) {
                    resultBox.innerHTML = `<span class="error">❌ ${escapeHtml(msg)}</span>`;
                } else {
                    resultBox.textContent = msg;
                }
                resultBox.scrollTop = 0;
            }
            function normalizePunctuation(str) {
                return str.replace(/：/g, ':').replace(/，/g, ',');
            }
            function calculate() {
                const rawInput = entry.value.trim();
                if (!rawInput) {
                    showResult('请输入食物信息！', true);
                    return;
                }
                const inputStr = normalizePunctuation(rawInput);
                const items = inputStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (items.length === 0) {
                    showResult('未检测到有效输入！', true);
                    return;
                }
                const outputLines = [];
                let totalWater = 0;
                const unknownItems = [];
                for (const raw of items) {
                    let name, weightStr, weight;
                    if (raw.includes(':')) {
                        const parts = raw.split(':');
                        name = parts[0].trim();
                        weightStr = parts.slice(1).join(':').trim();
                        if (weightStr === '') {
                            showResult(`重量格式错误：'${escapeHtml(raw)}'，请用数字表示重量（克）`, true);
                            return;
                        }
                        weight = parseFloat(weightStr);
                        if (isNaN(weight) || !isFinite(weight)) {
                            showResult(`重量格式错误：'${escapeHtml(raw)}'，请用数字表示重量（克）`, true);
                            return;
                        }
                    } else {
                        name = raw;
                        weight = 100;
                    }
                    if (weight <= 0) {
                        showResult(`重量必须为正数：'${escapeHtml(raw)}'`, true);
                        return;
                    }
                    if (Object.prototype.hasOwnProperty.call(VIRTUAL_WATER, name)) {
                        const coef = VIRTUAL_WATER[name];
                        const water = coef * (weight / 1000);
                        totalWater += water;
                        const weightPadded = weight.toFixed(1).padStart(6, ' ');
                        const waterPadded = water.toFixed(2).padStart(8, ' ');
                        outputLines.push(`${name.padEnd(8, ' ')} (${weightPadded} g)  →  ${waterPadded} 升`);
                    } else {
                        unknownItems.push(name);
                    }
                }
                if (unknownItems.length > 0) {
                    if (outputLines.length > 0) outputLines.push('');
                    for (const name of unknownItems) {
                        outputLines.push(`⚠️ 未知食物：${name}`);
                        outputLines.push('请尝试检查拼写或使用食材名称');
                    }
                }
                if (totalWater > 0) {
                    if (outputLines.length > 0) {
                        outputLines.push('');
                        outputLines.push('═'.repeat(40));
                    }
                    const totalStr = totalWater.toFixed(2);
                    outputLines.push(`💧 总虚拟水用量：${totalStr} 升`);
                    if (totalWater > 1000) {
                        outputLines.push(`   ≈ ${(totalWater / 1000).toFixed(2)} 吨`);
                    }
                }
                if (outputLines.length === 0) {
                    showResult('没有有效食物可计算，请检查输入。', true);
                    return;
                }
                showResult(outputLines.join('\n'), false);
            }

            calcBtn.addEventListener('click', calculate);
            entry.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calculate();
                }
            });
            entry.focus();
            resultBox.textContent = '等待输入…';
            <!-- console.log('✅ 虚拟水计算器已加载，数据条目数：', Object.keys(VIRTUAL_WATER).length); -->
        })();
    </script>
</body>
</html>
