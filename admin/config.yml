# 后端配置：告诉 CMS 你的代码存在哪
backend:
  name: github
  repo: ChrisX-Bytes/chrisx-bytes.github.io
  branch: main
#  base_url: https://chrisx-bytes.github.io/

# 媒体文件存放位置 (上传的图片等)
media_folder: 'assets/images'
public_folder: '/assets/images'

# 内容集合：定义你要管理哪些内容
collections:
  # 举例：管理 "新闻" 数据 (对应你项目里的 langs.js)
  - name: 'news'              # 集合名称，唯一标识
    label: '新闻'             # 后台显示的名称
    label_singular: '新闻'
    description: '管理网站上的新闻列表'
    # 指定数据存储方式：存为一个文件
    files:
      - name: 'news-data'
        label: '新闻数据'
        file: 'assets/js/langs.js'  # 数据存储的文件路径
        fields:
          # 定义你在后台要编辑哪些字段
          - { label: '语言标识', name: 'zh', widget: 'hidden', default: 'zh' }
          - name: 'news_items'
            label: '新闻列表'
            label_singular: '新闻条目'
            widget: 'list'           # 列表类型，可以添加多条
            fields:
              - { label: '日期', name: 'date', widget: 'string' }
              - { label: '标题', name: 'title', widget: 'string' }
              - { label: '描述', name: 'desc', widget: 'text' }
              - { label: '标签', name: 'tag', widget: 'string' }